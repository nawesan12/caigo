# Caigo en el VPS (/opt/caigo). Postgres propio; api y worker son binarios estáticos montados en una
# alpine (se despliega subiendo bin/*.nuevo y haciendo mv: el binario en uso no se pisa).
# Publicado sólo en 127.0.0.1: Docker se saltea UFW. Puertos reservados: 4300 api, 3500 web.
# Registro común de todas las apps: /opt/VPS.md.
name: caigo
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=40']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg
    volumes:
      - ./pg:/var/lib/postgresql/data
      - ./pg.secret:/run/secrets/pg:ro
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 30
  api:
    image: alpine:3.20
    restart: unless-stopped
    command: ['/app/bin/api']
    env_file: ./api.conf
    volumes:
      - ./bin:/app/bin:ro
      - ./archivos:/datos/archivos
      - ./apns:/datos/apns:ro
      - ./claves:/datos/claves:ro
    ports: ['127.0.0.1:4300:4300']
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    image: alpine:3.20
    restart: unless-stopped
    command: ['/app/bin/worker']
    env_file: ./api.conf
    volumes:
      - ./bin:/app/bin:ro
      # La purga de cuentas borradas borra sus fotos, selfie y DNI del disco.
      - ./archivos:/datos/archivos
      - ./apns:/datos/apns:ro
      - ./claves:/datos/claves:ro
    mem_limit: 96m
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /web
    command: ['node', 'build']
    env_file: ./web.conf
    environment:
      PORT: '3500'
      HOST: 0.0.0.0
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      CAIGO_API: http://api:4300
    volumes:
      - ./web:/web:ro
    ports: ['127.0.0.1:3500:3500']
    mem_limit: 192m
    depends_on:
      - api
