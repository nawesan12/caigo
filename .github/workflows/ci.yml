# Pruebas de la API, la web y las apps (con las de pantallas) en cada push y PR. El repo es público: Actions es gratis.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caigo
          POSTGRES_DB: caigo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5448:5432']
        options: >-
          --health-cmd "pg_isready -U caigo" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go run ./cmd/caigoctl bootstrap && go run ./cmd/caigoctl migrar
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      # paridad.txt (las pantallas de iOS) y la API simulada (apps/pruebas/respuestas.json), frescos.
      - run: herramientas/paridad.sh
      # Los tests incluyen PantallasTest. La galería de capturas la sube el espejo grupovimo/caigo-android.
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest -Proborazzi.test.record=true
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-android
          path: apps/android/app/build/reports/tests
          retention-days: 3
          if-no-files-found: ignore

  # La app de iPhone: el proyecto sale de project.yml (XcodeGen) y se compila para el simulador sin
  # firmar. El núcleo (modelos, API, lógica) se prueba aparte con swift test.
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: swift test
        working-directory: apps/ios/Nucleo
      - run: xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild -project Caigo.xcodeproj -scheme Caigo -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build \
            | tee build.log | xcbeautify --renderer github-actions
      - if: failure()
        run: grep -E 'error:' build.log | sort -u | head -150
      # Las pruebas (CaigoTests: PantallasTests monta cada pantalla con la API simulada), en Release como lo que llega a
      # TestFlight, con testability para @testable. Si una se cuelga, XCTest la corta a los 4 minutos.
      - name: Probar
        run: |
          set -o pipefail
          sim=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulador: $sim"
          xcodebuild test -project Caigo.xcodeproj -scheme Caigo -configuration Release -only-testing:CaigoTests \
            -destination "platform=iOS Simulator,id=$sim" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 600 \
            -resultBundlePath probar.xcresult \
            | tee probar.log | xcbeautify --renderer github-actions
      - if: failure()
        run: grep -E -B2 -A30 'Fatal error|crashed|Thread 0 Crashed|error:' probar.log | head -150 || true
      - if: failure()
        name: Reportes de crash del simulador
        run: |
          for f in $(find ~/Library/Logs/DiagnosticReports -name 'Caigo*' -mmin -60 2>/dev/null | head -3); do
            echo "== $f"; head -c 6000 "$f"
          done
