# Pruebas de la API y de la web en cada push y PR. El repo es público: Actions es gratis.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caigo
          POSTGRES_DB: caigo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5448:5432']
        options: >-
          --health-cmd "pg_isready -U caigo" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go run ./cmd/caigoctl bootstrap && go run ./cmd/caigoctl migrar
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:assembleDebug test

  # La app de iPhone: el proyecto sale de project.yml (XcodeGen) y se compila para el simulador sin
  # firmar. El núcleo (modelos, API, lógica) se prueba aparte con swift test.
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: swift test
        working-directory: apps/ios/Nucleo
      - run: xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild -project Caigo.xcodeproj -scheme Caigo -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build \
            | tee build.log | xcbeautify --renderer github-actions
      - if: failure()
        run: grep -E 'error:' build.log | sort -u | head -150
