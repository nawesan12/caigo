# Compila Caigo para iPhone (app + App Clip), lo firma con la clave de App Store Connect y lo sube a
# TestFlight. Nada se compila en la Mac. Se corre a mano (Actions › testflight › Run workflow) o con
# `gh workflow run testflight`. El número de build es el número de corrida.
name: testflight
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  subir:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: brew install xcodegen
      - name: Clave de App Store Connect y secretos de la app
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CLERK_PUBLICABLE: ${{ secrets.CAIGO_CLERK_PUBLICABLE }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/clave.p8"
          printf 'CAIGO_CLERK_PUBLICABLE = %s\n' "$CLERK_PUBLICABLE" > Config/Secretos.xcconfig
      - run: xcodegen generate
      - name: Archive firmado
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project Caigo.xcodeproj -scheme Caigo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Caigo.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=M6935MSNQB \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/clave.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tee archive.log | xcbeautify --renderer github-actions
      - name: Subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/exportar.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>M6935MSNQB</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Caigo.xcarchive" \
            -exportPath "$RUNNER_TEMP/exportado" -exportOptionsPlist "$RUNNER_TEMP/exportar.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/clave.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee exportar.log | xcbeautify --renderer github-actions
      - if: failure()
        run: grep -hE 'error:|Error|No profiles|provisioning' archive.log exportar.log 2>/dev/null | sort -u | head -80
      - if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
