# TEMPORAL (mientras se arma la app de iPhone en ramas ios-*): sólo el job de iOS. Se borra al integrar.
name: ios-ramas
on:
  push:
    branches: ['ios-*']
jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >-
          xcodebuild -project Caigo.xcodeproj -scheme Caigo -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          | tee build.log | xcbeautify --renderer github-actions || (grep -E 'error:' build.log | head -100; exit 1)
