# El proyecto de Xcode sale de acá: `xcodegen generate` (no se versiona el .xcodeproj).
name: Caigo
options:
  bundleIdPrefix: ar.com.caigo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
packages:
  Nucleo:
    path: Nucleo
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Caigo:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Caigo.xcconfig
      Release: Config/Caigo.xcconfig
    sources:
      - path: Caigo
    dependencies:
      - package: Nucleo
      - target: CaigoClip
        embed: true
    entitlements:
      path: Caigo/Caigo.entitlements
      properties:
        # development en Debug, production en Release (APS_ENTORNO sale de la configuración).
        aps-environment: $(APS_ENTORNO)
        com.apple.developer.associated-domains:
          - applinks:caigo.com.ar
          - appclips:caigo.com.ar
        com.apple.security.application-groups:
          - group.ar.com.caigo.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.caigo.app
        com.apple.developer.nfc.readersession.formats:
          - TAG
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.caigo.app
        PRODUCT_NAME: Caigo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENTORNO: development
        Release:
          APS_ENTORNO: production
          # Release se firma a mano con el certificado de distribución y su perfil de App Store
          # (GitHub Actions: workflow testflight; credenciales en ~/Trabajo/vimo/credenciales-apple).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Caigo App Store
    info:
      path: Caigo/Info.plist
      properties:
        CFBundleDisplayName: Caigo
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CaigoAPI: $(CAIGO_API)
        CaigoClerkPublicable: $(CAIGO_CLERK_PUBLICABLE)
        CaigoGrupoLlavero: $(AppIdentifierPrefix)ar.com.caigo.app
        CFBundleURLTypes:
          - CFBundleURLName: ar.com.caigo.app
            CFBundleURLSchemes: [ar.com.caigo.app]
        UIAppFonts: [Geist-400.ttf, Geist-500.ttf, Geist-600.ttf, Geist-700.ttf, Geist-800.ttf]
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Para la selfie con prueba de vida, las fotos del DNI y escanear el QR de entrada."
        NSLocationWhenInUseUsageDescription: "Para mostrarte los planes que tenés cerca y hacer check-in cuando llegás."
        NSPhotoLibraryUsageDescription: "Para elegir las fotos de tu perfil y del plan."
        NFCReaderUsageDescription: "Para hacer check-in apoyando el celu en la placa de Caigo Tap."
        LSApplicationQueriesSchemes: [whatsapp]
  # App Clip de Caigo Tap: se abre desde https://caigo.com.ar/t/<placa> (NFC o QR) y hace el check-in.
  # Comparte con la app el tema, las piezas, el contenedor, el ingreso con Clerk y la pantalla "Adentro".
  CaigoClip:
    type: application.on-demand-install-capable
    platform: iOS
    configFiles:
      Debug: Config/Caigo.xcconfig
      Release: Config/Caigo.xcconfig
    sources:
      - path: CaigoClip
      - path: Caigo/Tema
      - path: Caigo/Piezas
      - path: Caigo/Recursos
      - path: Caigo/App/Contenedor.swift
      - path: Caigo/App/Ir.swift
      - path: Caigo/App/Push.swift
      - path: Caigo/Pantallas/Pagos/PagosComun.swift
      - path: Caigo/Pantallas/Pagos/Adentro.swift
      - path: Caigo/Pantallas/Ingreso/IngresoClerk.swift
    dependencies:
      - package: Nucleo
    entitlements:
      path: CaigoClip/CaigoClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)ar.com.caigo.app
        com.apple.developer.associated-domains:
          - appclips:caigo.com.ar
        com.apple.security.application-groups:
          - group.ar.com.caigo.app
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.caigo.app.Clip
        PRODUCT_NAME: CaigoClip
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Caigo Clip App Store
    info:
      path: CaigoClip/Info.plist
      properties:
        CFBundleDisplayName: Caigo
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CaigoAPI: $(CAIGO_API)
        CaigoClerkPublicable: $(CAIGO_CLERK_PUBLICABLE)
        CaigoGrupoLlavero: $(AppIdentifierPrefix)ar.com.caigo.app
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        UIAppFonts: [Geist-400.ttf, Geist-500.ttf, Geist-600.ttf, Geist-700.ttf, Geist-800.ttf]
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Para escanear el QR de la placa."
  CaigoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CaigoTests
      # Las respuestas de la API simulada, las mismas que lee Android.
      - path: ../pruebas/respuestas.json
        buildPhase: resources
      # Qué links abren la app (EnlacesTests), lo mismo que sirve Caddy.
      - path: ../pruebas/enlaces.json
        buildPhase: resources
    dependencies:
      - target: Caigo
      - package: Nucleo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Caigo:
    build:
      targets:
        Caigo: all
        CaigoTests: [test]
    test:
      targets: [CaigoTests]
